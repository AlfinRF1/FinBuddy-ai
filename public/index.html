<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBuddy AI - Pro Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
        @keyframes popIn { 0% { transform: translateY(15px) scale(0.95); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        .animate-float { animation: floating 3s ease-in-out infinite; }
        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .glass-header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); backdrop-filter: blur(10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex justify-center items-center p-4">

    <div class="w-full max-w-6xl bg-white h-[92vh] rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden border border-white relative">
        
        <!-- Header -->
        <div class="glass-header text-white p-6 px-10 rounded-b-[2.5rem] z-20 relative shadow-lg">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 relative z-10">
                <div class="flex items-center gap-5">
                    <div class="bg-white text-blue-600 h-16 w-16 flex items-center justify-center rounded-2xl text-4xl shadow-lg animate-float">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold">FinBuddy.ai</h1>
                        <p class="text-blue-100 text-xs font-semibold uppercase tracking-widest mt-1">Smart Financial Tracker</p>
                    </div>
                </div>

                <div class="flex flex-wrap gap-4 items-center">
                    <div class="bg-white/10 rounded-2xl p-4 px-8 border border-white/20 shadow-inner flex items-center gap-4 min-w-[240px]">
                        <div class="text-2xl"><i class="fa-solid fa-wallet"></i></div>
                        <div>
                            <span class="text-[10px] font-bold text-blue-100 uppercase block mb-1">Saldo Saat Ini</span>
                            <h2 class="text-2xl font-bold" id="total-saldo">Rp 0</h2>
                        </div>
                    </div>
                    <div class="bg-white/10 rounded-2xl p-4 px-6 border border-white/10 shadow-inner min-w-[180px]">
                        <span class="text-[10px] font-bold text-blue-100 block mb-1">Pemasukan</span>
                        <span class="text-xl font-bold text-green-300" id="total-pemasukan">Rp 0</span>
                    </div>
                    <div class="bg-white/10 rounded-2xl p-4 px-6 border border-white/10 shadow-inner min-w-[180px]">
                        <span class="text-[10px] font-bold text-blue-100 block mb-1">Pengeluaran</span>
                        <span class="text-xl font-bold text-red-200" id="total-pengeluaran">Rp 0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 flex overflow-hidden bg-slate-50/50">
            <!-- Left Side: Chatbot (60%) -->
            <div class="w-full md:w-3/5 flex flex-col border-r border-slate-200">
                <!-- Area Chat (Kiri) -->
                <div id="chat-box" class="flex-1 overflow-y-auto p-8 space-y-8 bg-white/40">
                    <!-- Label Status -->
                    <div class="flex justify-center">
                        <span class="bg-slate-200/60 text-slate-500 text-[10px] px-5 py-2 rounded-full font-bold uppercase tracking-[0.2em] backdrop-blur-sm">Live Financial Assistant</span>
                    </div>

                    <!-- KATA SAMBUTAN -->
                    <div class="flex gap-5 animate-pop">
                        <div class="bg-gradient-to-br from-blue-100 to-blue-50 text-blue-600 rounded-full h-12 w-12 flex items-center justify-center text-xl flex-shrink-0 shadow-sm border border-blue-100 mt-1">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="flex flex-col gap-2 max-w-[80%]">
                            <div class="bg-white p-5 px-6 rounded-[2rem] rounded-tl-none shadow-sm text-base text-slate-700 border border-slate-100 leading-relaxed font-medium">
                                Halo! Selamat datang kembali di FinBuddy Pro. Siap buat rapikan catatan keuangan lu hari ini? Ketik aja gajian atau belanjaan mu ya! 💸
                            </div>
                            <span class="text-xs text-slate-400 font-bold ml-3 uppercase" id="waktu-bot-1"></span>
                        </div>
                    </div>
                </div>

                <!-- Input Field -->
                <div class="p-6 bg-white border-t border-slate-100">
                    <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar justify-center">
                        <button onclick="kirimCepat('☕ Ngopi dulu 15rb')" class="flex-shrink-0 bg-white border border-slate-200 hover:bg-blue-50 px-4 py-2 rounded-full text-xs font-bold transition-all">☕ Kopi -15rb</button>
                        <button onclick="kirimCepat('💰 Gajian masuk 3 juta')" class="flex-shrink-0 bg-white border border-green-200 hover:bg-green-50 px-4 py-2 rounded-full text-xs font-bold transition-all">💰 Gajian +3jt</button>
                        <button onclick="kirimCepat('🛵 Isi bensin 20rb')" class="flex-shrink-0 bg-white border border-slate-200 hover:bg-blue-50 px-4 py-2 rounded-full text-xs font-bold transition-all">🛵 Bensin -20rb</button>
                    </div>
                    <form id="chat-form" class="flex gap-4 relative items-center w-full max-w-4xl" enctype="multipart/form-data">
                    
                    <input type="file" id="file-input" class="hidden"
                        accept="image/*,audio/*,.pdf,.doc,.docx,.txt">
                    
                    <div class="relative w-full shadow-lg rounded-full flex items-center gap-3 px-3 bg-slate-50 border border-slate-200">
                        <!-- IMAGE -->
                        <button type="button" onclick="pickFile('image')"
                        class="pl-4 text-slate-400 hover:text-blue-600">
                            <i class="fa-solid fa-camera text-lg"></i>
                        </button>

                        <!-- AUDIO -->
                        <button type="button" onclick="pickFile('audio')"
                        class="text-slate-400 hover:text-green-600">
                            <i class="fa-solid fa-microphone text-xl"></i>
                        </button>

                        <!-- DOCUMENT -->
                        <button type="button" onclick="pickFile('doc')"
                        class="text-slate-400 hover:text-purple-600">
                            <i class="fa-solid fa-file text-lg"></i>
                        </button>
                        
                        <input type="text" id="user-input" autocomplete="off"
                            class="w-full bg-transparent text-base py-4 pl-2 pr-16 focus:outline-none focus:ring-0"
                            placeholder="Ketik pesan atau upload file (foto, audio, dokumen)...">
                    </div>
                    
                    <button type="submit" id="btn-kirim"
                        class="absolute right-2 top-2 bottom-2 bg-blue-600 text-white rounded-full w-12 flex items-center justify-center hover:scale-105 shadow-lg">
                        <i class="fa-solid fa-paper-plane text-xl"></i>
                    </button>
                </form>
                </div>
            </div>

            <!-- Right Side: Tables (40%) -->
            <div class="hidden md:flex w-2/5 flex-col p-8 gap-6 overflow-y-auto">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-bold text-slate-800 tracking-tight">Riwayat Data</h3>
                    <button onclick="clearData()" class="text-[10px] font-bold text-red-500 uppercase hover:underline">Reset Data</button>
                </div>

                <!-- Table Pemasukan -->
                <div class="bg-white rounded-[2rem] border border-green-100 shadow-sm overflow-hidden flex flex-col h-1/2">
                    <div class="bg-green-50 p-4 px-6 border-b border-green-100 flex justify-between items-center">
                        <span class="text-xs font-bold text-green-700 uppercase tracking-widest"><i class="fa-solid fa-circle-arrow-down mr-2"></i> Pemasukan</span>
                    </div>
                    <div class="flex-1 overflow-y-auto">
                        <table class="w-full text-left">
                            <tbody id="income-table-body" class="text-sm"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Table Pengeluaran -->
                <div class="bg-white rounded-[2rem] border border-red-100 shadow-sm overflow-hidden flex flex-col h-1/2">
                    <div class="bg-red-50 p-4 px-6 border-b border-red-100 flex justify-between items-center">
                        <span class="text-xs font-bold text-red-700 uppercase tracking-widest"><i class="fa-solid fa-circle-arrow-up mr-2"></i> Pengeluaran</span>
                    </div>
                    <div class="flex-1 overflow-y-auto">
                        <table class="w-full text-left">
                            <tbody id="expense-table-body" class="text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
const chatForm = document.getElementById('chat-form');
const userInput = document.getElementById('user-input');
const chatBox = document.getElementById('chat-box');
const totalPemasukanEl = document.getElementById('total-pemasukan');
const totalPengeluaranEl = document.getElementById('total-pengeluaran');
const totalSaldoEl = document.getElementById('total-saldo');
const incomeTableBody = document.getElementById('income-table-body');
const expenseTableBody = document.getElementById('expense-table-body');
const btnKirim = document.getElementById('btn-kirim');
const fileInput = document.getElementById('file-input');

function pickFile(type) {
    if (type === 'image') {
        fileInput.accept = "image/*";
    } else if (type === 'audio') {
        fileInput.accept = "audio/*";
    } else {
        fileInput.accept = ".pdf,.doc,.docx,.txt";
    }

    fileInput.click();
}

let totalMasuk = parseInt(localStorage.getItem('totalMasuk')) || 0;
let totalKeluar = parseInt(localStorage.getItem('totalKeluar')) || 0;
let riwayat = JSON.parse(localStorage.getItem('riwayat')) || [];

const formatRupiah = (angka) =>
    new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
    }).format(angka);

// ======================
// DASHBOARD
// ======================
const updateDashboard = () => {
    totalPemasukanEl.innerText = formatRupiah(totalMasuk);
    totalPengeluaranEl.innerText = formatRupiah(totalKeluar);

    const saldo = totalMasuk - totalKeluar;
    totalSaldoEl.innerText = formatRupiah(saldo);
    totalSaldoEl.className = `text-2xl font-bold ${saldo < 0 ? 'text-red-300' : 'text-white'}`;

    localStorage.setItem('totalMasuk', totalMasuk);
    localStorage.setItem('totalKeluar', totalKeluar);
    localStorage.setItem('riwayat', JSON.stringify(riwayat));

    renderTables();
};

// ======================
// TABLE
// ======================
const renderTables = () => {
    const incomeHtml = riwayat
        .filter(t => t.jenis === 'Pemasukan')
        .map(t => `
        <tr class="border-b hover:bg-green-50/30 animate-pop">
            <td class="p-4 font-semibold">${t.kategori}</td>
            <td class="p-4 text-right text-green-500 font-bold">+${formatRupiah(t.nominal)}</td>
        </tr>
    `).reverse().join('');

    const expenseHtml = riwayat
        .filter(t => t.jenis !== 'Pemasukan')
        .map(t => `
        <tr class="border-b hover:bg-red-50/30 animate-pop">
            <td class="p-4 font-semibold">${t.kategori}</td>
            <td class="p-4 text-right text-red-500 font-bold">-${formatRupiah(t.nominal)}</td>
        </tr>
    `).reverse().join('');

    incomeTableBody.innerHTML = incomeHtml || `<tr><td class="p-6 text-center text-slate-300">Belum ada pemasukan</td></tr>`;
    expenseTableBody.innerHTML = expenseHtml || `<tr><td class="p-6 text-center text-slate-300">Belum ada pengeluaran</td></tr>`;
};

const clearData = () => {
    if (confirm("Hapus semua data?")) {
        localStorage.clear();
        location.reload();
    }
};

window.kirimCepat = (teks) => {
    userInput.value = teks;
    btnKirim.click();
};

// ======================
// VALIDASI FILE
// ======================
const validateFile = (file) => {
    const maxSize = 5 * 1024 * 1024; // 5MB
    if (file.size > maxSize) {
        alert("File maksimal 5MB bro!");
        return false;
    }
    return true;
};

// ======================
// SUBMIT
// ======================
chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const pesan = userInput.value.trim();
    const file = fileInput.files[0];

    if (!pesan && !file) return;
    if (file && !validateFile(file)) return;

    btnKirim.disabled = true;

    // ======================
    // USER TEXT
    // ======================
    if (pesan) {
        chatBox.innerHTML += `
        <div class="flex justify-end animate-pop">
            <div class="bg-blue-600 text-white p-4 rounded-3xl">
                ${pesan}
            </div>
        </div>`;
    }

    // ======================
    // FILE PREVIEW
    // ======================
    if (file) {
        const type = file.type;
        const url = URL.createObjectURL(file);

        if (type.startsWith('image/')) {
            chatBox.innerHTML += `
            <div class="flex justify-end animate-pop">
                <img src="${url}" class="max-w-[200px] rounded-xl">
            </div>`;
        }

        else if (type.startsWith('audio/')) {
            chatBox.innerHTML += `
            <div class="flex justify-end animate-pop">
                <audio controls class="max-w-[220px]">
                    <source src="${url}" type="${type}">
                </audio>
            </div>`;
        }

        else {
            chatBox.innerHTML += `
            <div class="flex justify-end animate-pop">
                <div class="bg-blue-100 px-3 py-2 rounded-lg text-xs font-bold">
                    📎 ${file.name}
                </div>
            </div>`;
        }
    }

    userInput.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // ======================
    // LOADING
    // ======================
    const loadingId = 'loading-' + Date.now();
    chatBox.innerHTML += `
    <div id="${loadingId}" class="flex gap-3 items-center">
        <div class="bg-slate-200 rounded-full h-10 w-10 flex items-center justify-center">
            🤖
        </div>
        <div class="bg-white px-4 py-2 rounded-xl flex gap-2">
            <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></span>
            <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:.2s"></span>
            <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:.4s"></span>
        </div>
    </div>`;

    try {
        const formData = new FormData();
        formData.append('pesan', pesan);
        if (file) formData.append('foto', file);

        const response = await fetch('/api/catat', {
            method: 'POST',
            body: formData
        });

        const hasil = await response.json();
        document.getElementById(loadingId)?.remove();

        if (hasil.status === 'sukses') {
            const data = hasil.data;

            if (data.jenis_transaksi.toLowerCase() === 'pemasukan') {
                totalMasuk += data.nominal;
            } else {
                totalKeluar += data.nominal;
            }

            riwayat.push({
                kategori: data.kategori,
                nominal: data.nominal,
                jenis: data.jenis_transaksi
            });

            updateDashboard();

            chatBox.innerHTML += `
            <div class="flex gap-3 animate-pop">
                <div class="bg-blue-600 text-white h-10 w-10 rounded-full flex items-center justify-center">🤖</div>
                <div class="bg-white p-4 rounded-2xl max-w-[80%]">
                    <p class="mb-2">✨ ${data.pesan_finbuddy}</p>
                    <b class="${data.jenis_transaksi.toLowerCase() === 'pemasukan' ? 'text-green-500' : 'text-red-500'}">
                        ${formatRupiah(data.nominal)}
                    </b>
                </div>
            </div>`;
        } else {
            throw new Error(hasil.message || "Gagal bro");
        }

    } catch (err) {
        document.getElementById(loadingId)?.remove();

        chatBox.innerHTML += `
        <div class="text-red-500 text-sm text-center">
            ⚠️ Error: ${err.message}
        </div>`;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
    fileInput.value = '';
    btnKirim.disabled = false;
});

updateDashboard();
</script>
</body>
</html>
